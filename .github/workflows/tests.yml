name: tests-workflow
run-name: ${{ github.actor }} is testing changes
on: [ push, pull_request ]
jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Taskfile
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Install system C-libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config
      - name: Install dependencies
        run: go get ./...
      - name: Prepare dummy frontend dist
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/placeholder.txt
      - name: Run tests
        run: task -d scripts tests integration=false -v
